name: images

on:
  push:
    branches: [main]
    paths:
      - os/**
      - Makefile
      - .github/workflows/images.yml
  pull_request:
    paths:
      - os/**
      - Makefile
      - .github/workflows/images.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: host
            image: homelab-host
            make_var: HOST_IMAGE
          - target: guest
            image: homelab-guest
            make_var: GUEST_IMAGE
    steps:
      - uses: actions/checkout@v7

      - name: Set image reference
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build
        run: make ${{ matrix.target }} ${{ matrix.make_var }}="${IMAGE}:${SHORT_SHA}"

      - name: Log into GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          podman push --digestfile digest.txt "${IMAGE}:${SHORT_SHA}"
          echo "DIGEST=$(cat digeest.txt)" >> "$GITHUB_ENV"
          for tag in latest "$(date -u +%Y%m%d)"; do
            skopeo copy --preserve-digests \
              "docker://${IMAGE}:${SHORT_SHA}" "docker://${IMAGE}:${tag}"
          done

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false --user-signing-config=false \
            "${IMAGE}@${DIGEST}"
