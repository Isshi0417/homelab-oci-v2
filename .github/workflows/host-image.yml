name: host-image

on:
  push:
    branches: [main]
    paths:
      - os/host/**
      - Makefile
      - .github/workflows/host-image.yml
  pull_request:
    paths:
      - os/host/**
      - Makefile
      - .github/workflows/host-image.yml
  schedule:
    - cron: "0 6 * * 1" # weekly rebuild picks up base image security fixes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: homelab-host

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set image reference
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build
        run: make host HOST_IMAGE="${IMAGE}:${SHORT_SHA}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          podman push --digestfile digest.txt "${IMAGE}:${SHORT_SHA}"
          echo "DIGEST=$(cat digest.txt)" >> "$GITHUB_ENV"
          for tag in latest "$(date -u +%Y%m%d)"; do
            skopeo copy --preserve-digests \
              "docker://${IMAGE}:${SHORT_SHA}" "docker://${IMAGE}:${tag}"
          done

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false --use-signing-config=false \
            "${IMAGE}@${DIGEST}"
